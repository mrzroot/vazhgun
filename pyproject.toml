[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vazhgun"
dynamic = ["version"]
description = "Audit a Persian/Arabic .docx thesis for bidi problems: ۲-۳ drawn as ۳-۲, -۵ drawn as ۵-, left-to-right paragraphs and tables. Offline, with an explicit fix written to a copy."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mohammadreza Zare", email = "mrzroot@users.noreply.github.com" }]
keywords = ["persian", "farsi", "docx", "bidi", "rtl", "thesis", "word", "unicode", "linter", "iran"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Natural Language :: Persian",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7", "python-bidi>=0.6"]

[project.urls]
Homepage = "https://mrzroot.github.io/vazhgun/"
Source = "https://github.com/mrzroot/vazhgun"
Issues = "https://github.com/mrzroot/vazhgun/issues"

[project.scripts]
vazhgun = "vazhgun.cli:main"

[tool.setuptools.dynamic]
version = { attr = "vazhgun.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
