name: Bug
description: A crash, a corrupted .docx, or output that behaves wrongly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not attach a real thesis or anyone's private document. A tiny invented .docx that reproduces it is ideal."
  - type: input
    id: version
    attributes: {label: vazhgun version (`vazhgun --version`), placeholder: "0.1.0"}
    validations: {required: true}
  - type: input
    id: env
    attributes: {label: Python and OS, placeholder: "3.12 · Ubuntu 24.04"}
  - type: textarea
    id: steps
    attributes: {label: Command and what you saw}
    validations: {required: true}
